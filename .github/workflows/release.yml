name: Release

# BRAT (and manual installs) expect a GitHub Release per version, with main.js/manifest.json/styles.css
# attached as plain assets — this builds those from source and publishes them whenever a tag is pushed.
# Tag name must exactly match manifest.json's "version" (Obsidian/BRAT convention), e.g. "0.1.0".
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # npm install, not ci: a transitive dep (vitest -> vite) wants a newer esbuild than the plugin's
      # own direct pin, needing two nested esbuild installs — reconciling that on the fly is more
      # robust here than requiring the lockfile to exactly reproduce under whatever npm ships with
      # this runner's Node version.
      - run: npm install
      - run: npm run build

      - name: Verify manifest version matches the tag
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest_version=$(node -p "require('./manifest.json').version")
          if [ "$tag" != "$manifest_version" ]; then
            echo "Tag ($tag) does not match manifest.json version ($manifest_version)"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title "$tag" \
            --notes "See commit history for changes in this release." \
            main.js manifest.json styles.css
